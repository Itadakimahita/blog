services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - settings/.env
    environment:
      BLOG_SQLITE_PATH: /data/db.sqlite3
    command: daphne -b 0.0.0.0 -p 8000 settings.asgi:application
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - settings/.env
    environment:
      BLOG_SQLITE_PATH: /data/db.sqlite3
    command: celery -A settings worker -l info
    depends_on:
      - redis
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - settings/.env
    environment:
      BLOG_SQLITE_PATH: /data/db.sqlite3
    command: celery -A settings beat -l info
    depends_on:
      - redis
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - settings/.env
    environment:
      BLOG_SQLITE_PATH: /data/db.sqlite3
    command: sh -c 'celery -A settings flower --basic-auth=$BLOG_FLOWER_USER:$BLOG_FLOWER_PASSWORD --port=5555'
    ports:
      - "5555:5555"
    depends_on:
      - redis
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

volumes:
  sqlite_data:
